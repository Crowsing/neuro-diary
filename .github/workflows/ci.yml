name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # §9.6 і §13.3: перевіряється сам артефакт, а не намір. Прапорець збірки
      # може зламатися мовчки, і тоді демо-дані або мережевий код опиняться в
      # local-only бандлі без жодного червоного тесту.
      - run: node apps/web/scripts/assert-bundle.mjs apps/web/dist
      # `VITE_REMINDERS` тут свідомо не задається, тобто лишається `off`.
      #
      # Форм збірки три, і кожна перевіряється рівно один раз, без жодного
      # зайвого прогону: `dist` вище — local-only (нуль `/v1/`); `dist-sync`
      # тут — та форма, якою пішов би продакшен (sync є, нагадувань немає);
      # `dist-sync` у job `sync-e2e` нижче — єдина з `VITE_REMINDERS=on`, і
      # саме там шлях нагадувань проходиться проти живого api. Обидві гілки
      # прапорця, отже, під тестом: одна на відсутність, друга на присутність.
      - name: Build the sync bundle and assert its shape
        run: |
          VITE_SYNC=on \
          VITE_API_ORIGIN=http://localhost:8000 \
          VITE_OUT_DIR=dist-sync \
          pnpm build
          node apps/web/scripts/assert-bundle.mjs apps/web/dist-sync --sync \
            --api=http://localhost:8000
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy --strict app
      - run: uv run --locked pytest
      # Phase 2 DoD: the fixtures both applications read must stay in step.
      - run: uv run --locked pytest tests/contract
      # Phase 1 DoD: the initData validator keeps 100% branch coverage.
      - run: >-
          uv run --locked pytest tests/unit/test_initdata_validator.py
          --cov=app.infra.telegram.initdata --cov-branch --cov-fail-under=100
      - run: uv run --locked ruff format --check .
      - run: uv run --locked lint-imports

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy --strict bot
      - run: uv run --locked pytest

  # DoD Фази 2: два браузерні профілі синхронізуються через локальний api.
  #
  # Job окремий і блокуючий. Він не може бути частиною `web`: для нього потрібні
  # PostgreSQL, міграції й живий api, а наскрізний gate `pnpm e2e` мусить
  # лишатися запускним на будь-якій машині без стенду — саме тому sync-проєкт
  # Playwright вмикається лише змінною SYNC_E2E.
  sync-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: neuro
          POSTGRES_USER: neuro_admin
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuro_admin -d neuro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Тексти згод — версія 0.9 з плейсхолдером замість імені контролера, тож
      # у production-конфігурації сервер відмовляє у створенні згоди. Стенд
      # працює в development, і банер про це видимий в UI (перевіряється e2e).
      APP_ENV: development
      WEBAPP_URL: http://localhost:4174
      TELEGRAM_BOT_ID: "1234567890"
      # Публічний ключ детермінованої тестової пари з
      # apps/api/tests/integration/conftest.py (насіння — байти 0..31).
      # Секретом не є: приватна половина відтворюється в e2e-хелпері.
      TELEGRAM_ED25519_PUBLIC_KEY: 03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8
      MIGRATION_DATABASE_URL: postgresql://neuro_admin:ci_admin_password@127.0.0.1:5432/neuro
      API_DATABASE_URL: postgresql://api_rw:ci_api_password@127.0.0.1:5432/neuro
    steps:
      - uses: actions/checkout@v6
      # §11: `k_log` має епоху й знищується при ротації, тож літерал у git був би
      # і зайвим, і хибним за змістом. Заразом gitleaks не має що ловити:
      # 64 hex-символи виглядають як ключ незалежно від того, чим вони є.
      - name: Mint a per-run log pseudonymisation key
        run: echo "LOG_ACCOUNT_REF_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --locked alembic upgrade head
        working-directory: apps/api
      # Міграція створює ролі без паролів, щоб секрет не опинився в git.
      - name: Give the application role its CI password
        run: >-
          PGPASSWORD=ci_admin_password psql -h 127.0.0.1 -U neuro_admin -d neuro
          -c "ALTER ROLE api_rw PASSWORD 'ci_api_password';"
      - name: Start the api
        working-directory: apps/api
        run: |
          uv run --locked uvicorn app.main:app_factory --factory \
            --no-access-log --port 8000 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Two browser profiles through the local api
        run: SYNC_E2E=1 pnpm --filter web exec playwright test --project=sync
      - name: Api log on failure
        if: failure()
        run: tail -100 /tmp/api.log

  # DoD Фази 5 (§12): schemathesis по OpenAPI, блокуючим job-ом.
  #
  # Job окремий за тією самою причиною, що й `sync-e2e`: потрібні PostgreSQL,
  # міграції й живий api, а наскрізний gate `pytest` мусить лишатися запускним
  # без стенду. Схема віддається по HTTP лише в `development` — поза ним
  # `/openapi.json`, `/docs` і `/redoc` відсутні як маршрути, і обидві гілки під
  # тестом (`tests/unit/test_schema_exposure.py`).
  #
  # СТРАТЕГІЯ — уся в `scripts/fuzz-openapi.sh` і `schemathesis.toml`, а не лише
  # у звіті. Коротко, щоб не читати два файли:
  #
  #  * АВТЕНТИФІКАЦІЯ: фікстурна Ed25519-пара §8 (насіння — байти 0..31), той
  #    самий публічний ключ, що в job `sync-e2e` нижче. Без токена фаззер
  #    перевіряв би виключно шлях 401;
  #  * РУЙНІВНІ ОПЕРАЦІЇ: свіжий акаунт **на кожну операцію**, тож
  #    `POST /v1/account/delete`, `POST /v1/consents/revoke`,
  #    `POST /v1/account/vault-reset` і re-key фаззяться, а не виключаються, і
  #    руйнують лише власний акаунт. Виключень із фаззингу немає жодного;
  #  * SEED: детермінований (`SCHEMATHESIS_SEED`), інакше червоний CI
  #    невідтворюваний;
  #  * ЛІМІТИ §11 НЕ ПОСЛАБЛЮЮТЬСЯ. 429 доданий до переліку статусів, які дві
  #    перевірки вважають правильною відповіддю — бо він нею і є. Причина в
  #    `schemathesis.toml`.
  schemathesis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: neuro
          POSTGRES_USER: neuro_admin
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuro_admin -d neuro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      WEBAPP_URL: http://localhost:4174
      # Фікстурний id: initData підписується `<bot_id>:WebAppData\n…`, тож
      # значення мусить збігатися з тим, чим підписує скрипт мінтування.
      TELEGRAM_BOT_ID: "1234567890"
      TELEGRAM_ED25519_PUBLIC_KEY: 03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8
      MIGRATION_DATABASE_URL: postgresql://neuro_admin:ci_admin_password@127.0.0.1:5432/neuro
      API_DATABASE_URL: postgresql://api_rw:ci_api_password@127.0.0.1:5432/neuro
      SCHEMATHESIS_SEED: "20260726"
      SCHEMATHESIS_MAX_EXAMPLES: "20"
    steps:
      - uses: actions/checkout@v6
      - name: Mint a per-run log pseudonymisation key
        run: echo "LOG_ACCOUNT_REF_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --locked alembic upgrade head
        working-directory: apps/api
      - name: Give the application role its CI password
        run: >-
          PGPASSWORD=ci_admin_password psql -h 127.0.0.1 -U neuro_admin -d neuro
          -c "ALTER ROLE api_rw PASSWORD 'ci_api_password';"
      - name: Start the api
        working-directory: apps/api
        run: |
          uv run --locked uvicorn app.main:app_factory --factory \
            --no-access-log --port 8000 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
      - name: Fuzz every operation against its own account
        run: bash scripts/fuzz-openapi.sh
      - name: Api log on failure
        if: failure()
        run: tail -200 /tmp/api.log

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete history
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose --log-opts="--all" /repo
