[project]
name = "neuro-diary-bot"
version = "0.1.0"
description = "Telegram launcher for opening the Neuro Diary WebApp"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.30.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.mypy]
strict = true
