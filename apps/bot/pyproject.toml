[project]
name = "neuro-diary-bot"
version = "0.1.0"
description = "Telegram launcher for opening the Neuro Diary WebApp"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
