[project]
name = "neuro-diary-api"
version = "0.1.0"
description = "Neuro Diary API — плейсхолдер під майбутню опційну синхронізацію"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
