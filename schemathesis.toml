# Конфігурація schemathesis для прогону §12 Фази 5.
#
# Тут — рівно одна річ, і вона є **уточненням факту**, а не послабленням:
# `429 rate_limited` додано до переліку статусів, які дві перевірки вважають
# правильною відповіддю.
#
# Чому це факт, а не зручність. Обидві перевірки питають «чи сервер прийняв те,
# що мусив прийняти» і «чи відмовив там, де мусив відмовити». Їхні стандартні
# переліки не містять 429, бо були написані для API без застосункових лімітів.
# Для цього API 429 — задокументована відповідь (`app/api/v1/responses.py`),
# описана §11, з обов'язковим `Retry-After`, і вона означає рівно «запит не
# оброблено». Тобто:
#
#  * для `negative_data_rejection` 429 — це відмова, тобто саме те, чого
#    перевірка й вимагає;
#  * для `positive_data_acceptance` 429 — не «схемно-валідний запит відкинуто
#    помилково», а «вікно §11 витрачено», і наступний запит після `Retry-After`
#    пройде.
#
# **Ліміти при цьому не змінюються.** Альтернатива — послабити вікна §11 на час
# прогону — була б рівно тим дефектом, який Фаза 5 має ловити: «послаблення
# наявних гарантій заради зеленого фаззера». Друга альтернатива — гнати фаззер
# повільніше за вікно — коштувала 25 хвилин CI на п'ятнадцять операцій і не
# додавала жодної перевірки.
#
# `not_a_server_error` НЕ чіпається: 500 лишається дефектом.
#
# Що 429 справді є правильною відповіддю, доводять окремі тести, а не цей файл:
# `apps/api/tests/integration/test_sync_rate_limits.py` і
# `apps/api/tests/integration/test_endpoint_limits.py`.

[checks.negative_data_rejection]
expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "422", "428", "429", "5xx"]

[checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "429", "5xx"]

# 422 додано ТРЬОМ операціям, і лише їм. §10 кладе базу зон і quiet hours у
# домен, а не в схему: `Europe/Atlantis` добре сформована як рядок і невідома
# базі, `03:00` — валідний `HH:mm` і заборонений час. Обидві відмови правильні й
# невиразні в JSON Schema.
#
# Глобально 422 сюди НЕ додано свідомо: саме ця перевірка знайшла, що схема
# дозволяла `record_key: ""`, тоді як код відхиляв. Дозволити 422 всюди означало
# б погасити той клас знахідок — тобто найкорисніший, що дав цей прогін.

# ЧЕТВЕРТЕ І ДАЛІ: цілі числа. JSON Schema вважає `9007199254740990.0`
# валідним `integer` — «число без дробової частини», — а `strict=True` у
# `ContractModel` відхиляє float там, де оголошено ціле, і робить це свідомо: та
# сама строгість відхиляє `"5"`, `true` і `null`, тобто справжні клієнтські
# помилки. JSON Schema не має способу сказати «саме цілочисловий токен», тож
# схема тут настільки тісна, наскільки формат дозволяє, а код — тісніший.
#
# Це хибне спрацювання перевірки, а не розбіжність, яку можна виправити: щоб
# «виправити» її, довелося б або зняти `strict=True` (втратити відхилення `"5"`),
# або оголосити в схемі те, чого в ній не виражається. Причина названа, і
# поведінка запінена окремим тестом:
# `apps/api/tests/integration/test_fuzz_regressions.py::test_a_float_is_refused_
# where_the_contract_says_integer`.
#
# Перелічено поіменно, а не глобально: у решти операцій цілих полів немає, і
# 422 там і далі означає «схема слабша за код» — саме той клас знахідок, який
# цей прогін і дав.

[[operations]]
include-operation-id = "revoke_consent_v1_consents_revoke_post"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# ЗВУЖЕННЯ, НАЗВАНЕ ПРЯМО: для `POST /v1/sync/push` вимкнена coverage-фаза.
#
# Причина числова. Coverage-фаза будує межові випадки оголошених обмежень, і для
# цієї операції межа `maxItems: 200` разом із `maxLength` на `payload_b64`
# (base64 від 64 КіБ — 87 384 символи) дає тіло на ~17 МБ. Заміряно: понад
# **дев'ять хвилин** на одну операцію, з них 95% — CPU самого фаззера, тоді як
# сервер відповідає за мілісекунди. Решта чотирнадцять операцій разом — секунди.
#
# Схема при цьому НЕ послаблюється: межі лишаються оголошеними, бо вони правдиві
# (§9.5 дозволяє один запис на 64 КіБ і батч на 200 записів). Знімається саме
# генерація межового випадку, і кожну з тих меж стереже цільовий тест:
#
#  * запис понад 64 КіБ → 413:
#    `tests/integration/test_sync_push.py::test_a_payload_over_sixty_four_kibibytes_is_refused`;
#  * батч понад 200 → 422:
#    `::test_a_batch_over_two_hundred_records_is_refused_by_the_contract`;
#  * лічильники понад стелю → 422:
#    `tests/integration/test_fuzz_regressions.py::test_a_base_revision_past_the_ceiling_is_refused`;
#  * самі оголошення меж:
#    `tests/unit/test_schema_declarations.py::test_the_payload_bound_is_the_base64_of_the_record_limit`.
#
# Fuzzing-фаза для push працює далі — вимкнена лише coverage.

[[operations]]
include-operation-id = "push_v1_sync_push_post"
[operations.phases.coverage]
enabled = false
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "410", "413", "422", "429", "5xx"]

# 413 у двох операціях із base64-полями — теж не виняток, а факт контракту:
# «є base64» у JSON Schema не виражається (довжина, кратна чотирьом, не
# виражається взагалі), тож рядок `"0"` схемно валідний і не декодується.
# `decode_envelope` свідомо відповідає 413 замість того, щоб пустити сміття в
# БД, де CHECK віддав би 500 (рішення Фази 2, під тестом
# `test_sync_push.py::test_a_corrupted_payload_is_refused_before_the_database`).

[[operations]]
include-operation-id = "write_key_v1_sync_key_post"
[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "413", "422", "429", "5xx"]

